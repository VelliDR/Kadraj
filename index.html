<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kadraj | Sanatsal Mizanpaj Atölyesi</title>
    
    <!-- Favicon & İkonlar -->
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" content="#191c20" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,600&family=Lora:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,900;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-D4p2lrL-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D4TTFx37.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="app">
      <!-- 1. Üst Bar -->
      <header class="app-bar">
        <div class="brand">
          <span class="brand-badge">ATÖLYE</span>
          <span class="brand-title">Mizanpaj & Kırpma</span>
        </div>

        <div class="app-bar-actions">
          <!-- Üst Bar İçin Daraltılmış Mini Zoom Kadranı -->
          <div class="dial-container" style="width: 100px; margin: 0 5px;">
            <div class="dial-header" style="margin-bottom: 2px;">
              <span style="font-size: 9px;">🔍 ÖLÇEK</span>
              <span class="dial-value" id="zoomDisplay" style="font-size: 10px;">1.00x</span>
            </div>
            <div class="dial-track" id="zoomRange" style="height: 22px; border-radius: 4px;">
              <div class="dial-center-mark"></div>
            </div>
          </div>
          
          <button id="btnToggleBg" class="m3-btn m3-btn-tonal">🏁 Şeffaf</button>
          <button id="btnReset" class="m3-btn m3-btn-terracotta">Sıfırla</button>
          <button id="btnDownload" class="m3-btn m3-btn-sage">⬇️ Kaydet</button>
        </div>
      </header>

      <!-- 2. Merkez Çalışma Sahnesi -->
      <main class="workspace">
        <div id="canvas-container"></div>
        <div id="loadingOverlay" class="loading-overlay hidden">
          <div class="m3-spinner"></div>
          <p id="loadingText">İşleniyor...</p>
        </div>
      </main>

      <!-- 3. Alt Kontrol Paneli -->
      <footer class="control-dock">
        <nav class="dock-sidebar">
          <button class="dock-tab active" data-tab="tab-layers"><span class="dock-tab-icon">🖼️</span> Katman</button>
          <button class="dock-tab" data-tab="tab-typography"><span class="dock-tab-icon">✍️</span> Yazı</button>
          <button class="dock-tab" data-tab="tab-shadows"><span class="dock-tab-icon">🎭</span> Gölge</button>
          <button class="dock-tab" data-tab="tab-shapes"><span class="dock-tab-icon">📐</span> Şablon</button>
        </nav>

        <div class="dock-content">
          <!-- 1. Katman Paneli -->
          <div class="dock-panel active" id="tab-layers">
            <div class="panel-row">
              <label class="m3-btn m3-btn-sand file-label">📷 Görsel Seç<input type="file" id="imageInput" accept="image/*,.heic,.heif" /></label>
              <label class="m3-btn m3-btn-tonal file-label">📁 Resimden Maske<input type="file" id="maskInput" accept="image/*,.heic,.heif" /></label>
            </div>
            <div class="panel-row">
              <button id="btnInvertMask" class="m3-btn m3-btn-tonal hidden">🔄 Ters Çevir</button>
               <select id="aiEngineSelect" class="m3-select" title="Yapay Zeka Motoru">
                  <option value="isnet_quint8" selected>🎨 Standart (8-Bit)</option>
                  <option value="isnet_fp16">💎 Hassas (16-Bit)</option>
                  <option value="isnet">🔥 Ultra (32-Bit)</option>
               </select>
              <button id="btnSegment" class="m3-btn m3-btn-lavender">✨ Özneyi Ayır</button>
            </div>
          </div>

          <!-- 2. Tipografi Paneli -->
          <div class="dock-panel" id="tab-typography">
            <div class="panel-row">
              <input type="text" id="textInput" class="m3-input" placeholder="Dize veya başlık..." value="Taşın İçindeki Zaman" />
              <select id="fontSelect" class="m3-select">
                <option value="'Cormorant Garamond', serif">Cormorant</option>
                <option value="'Lora', serif">Lora</option>
                <option value="'Caveat', cursive">Caveat</option>
                <option value="'Playfair Display', serif">Playfair</option>
                <option value="'Cinzel', serif">Cinzel</option>
                <option value="'Montserrat', sans-serif">Montserrat</option>
                <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
              </select>
            </div>
            <div class="panel-row">
              <!-- YAZI BOYUTU KADRANI -->
              <div class="dial-container">
                <div class="dial-header">
                  <span>BOYUT</span>
                  <span class="dial-value" id="fontSizeDisplay">32px</span>
                </div>
                <div class="dial-track" id="fontSizeRange">
                  <div class="dial-center-mark"></div>
                </div>
              </div>

              <!-- DÖNDÜRME KADRANI -->
              <div class="dial-container">
                <div class="dial-header">
                  <span>DÖNDÜRME</span>
                  <span class="dial-value" id="textRotationDisplay">0°</span>
                </div>
                <div class="dial-track" id="textRotationRange">
                  <div class="dial-center-mark"></div>
                </div>
              </div>

              <!-- Renk & İşlem Butonları -->
              <div class="color-wrap" title="Yazı Rengi" style="margin-left: 10px;">
                <input type="color" id="textColor" value="#1a1a1a" />
              </div>
              <button id="btnAddText" class="m3-btn m3-btn-sand">➕ Ekle</button>
              <button id="btnDeleteText" class="m3-btn m3-btn-terracotta hidden">🗑️ Sil</button>
            </div>
          </div>

          <!-- 3. Gölgeler Paneli (TÜMÜ YATAY KADRAN) -->
          <div class="dock-panel" id="tab-shadows">
            <div class="panel-row">
              
              <!-- Kenar Yumuşatma Kadranı -->
              <div class="dial-container" style="max-width: 130px;">
                <div class="dial-header">
                  <span>✂️ YUMUŞATMA</span>
                  <span class="dial-value" id="edgeOverlapDisplay">%0.8</span>
                </div>
                <div class="dial-track" id="edgeOverlapRange">
                  <div class="dial-center-mark"></div>
                </div>
              </div>

              <div class="divider-v"></div>

              <!-- Şekil Gölge Grubu -->
              <div class="shadow-subgroup">
                <!-- Şekil Açı -->
                <div class="dial-container">
                  <div class="dial-header">
                    <span>📐 AÇI</span>
                    <span class="dial-value" id="shapeShadowAngleDisplay">45°</span>
                  </div>
                  <div class="dial-track" id="shapeShadowAngle">
                    <div class="dial-center-mark"></div>
                  </div>
                </div>
                <!-- Şekil Mesafe -->
                <div class="dial-container">
                  <div class="dial-header">
                    <span>MESAFE</span>
                    <span class="dial-value" id="shapeShadowDistDisplay">0px</span>
                  </div>
                  <div class="dial-track" id="shapeShadowDist">
                    <div class="dial-center-mark"></div>
                  </div>
                </div>
                <!-- Şekil Blur -->
                <div class="dial-container">
                  <div class="dial-header">
                    <span>BLUR</span>
                    <span class="dial-value" id="shapeShadowBlurDisplay">0px</span>
                  </div>
                  <div class="dial-track" id="shapeShadowBlur">
                    <div class="dial-center-mark"></div>
                  </div>
                </div>
              </div>
            </div>
            
            <div class="panel-row">
              <label class="toggle-pill" style="margin-top: 10px;">
                <input type="checkbox" id="chkSubjectShadow" /><span>👤 Silüet</span>
              </label>
              
              <!-- Silüet Açı -->
              <div class="dial-container">
                <div class="dial-header">
                  <span>AÇI</span>
                  <span class="dial-value" id="subjShadowAngleDisplay">135°</span>
                </div>
                <div class="dial-track" id="subjShadowAngle">
                  <div class="dial-center-mark"></div>
                </div>
              </div>
              
              <!-- Silüet Mesafe -->
              <div class="dial-container">
                <div class="dial-header">
                  <span>MESAFE</span>
                  <span class="dial-value" id="subjShadowDistDisplay">14px</span>
                </div>
                <div class="dial-track" id="subjShadowDist">
                  <div class="dial-center-mark"></div>
                </div>
              </div>
              
              <!-- Silüet Renk -->
              <div class="color-wrap" title="Silüet Rengi" style="margin-top: 15px; margin-left: 10px;">
                <input type="color" id="subjShadowColor" value="#1a1a1a" />
              </div>
            </div>
          </div>

          <!-- 4. Şablonlar Paneli (Tam Liste) -->
          <div class="dock-panel" id="tab-shapes">
            <div class="shape-scroll" id="shapeButtons">
              <button class="shape-pill" data-shape="fluidRiver">🌊 Akışkan Nehir</button>
              <button class="shape-pill" data-shape="fluidCorners">🌓 Karşıt Köşeler</button>
              <button class="shape-pill" data-shape="blob">💧 Akışkan Leke</button>
              <button class="shape-pill" data-shape="waveTop">〰️ Dalgalı Tepe</button>
              <button class="shape-pill" data-shape="arch">🏛️ Antik Kemer</button>
              <button class="shape-pill" data-shape="doubleArch">🚪 İkili Portal</button>
              <button class="shape-pill" data-shape="cinemaFrame">📺 Retro Ekran</button>
              <button class="shape-pill" data-shape="ticket">🎟️ Sinema Bileti</button>
              <button class="shape-pill" data-shape="torn1">📜 Dikey Yırtık</button>
              <button class="shape-pill" data-shape="torn2">📄 Alt Yırtık</button>
              <button class="shape-pill" data-shape="tornWindow">🕳️ Yırtık Pencere</button>
              <button class="shape-pill" data-shape="stamp">📮 Posta Pulu</button>
              <button class="shape-pill" data-shape="puzzle">🧩 Puzzle</button>
              <button class="shape-pill" data-shape="diagonal">⚡ Çapraz Kesim</button>
              <button class="shape-pill" data-shape="diagonalSplit">📐 Çapraz Şerit</button>
              <button class="shape-pill" data-shape="hexagon">⬡ Altıgen</button>
              <button class="shape-pill" data-shape="diamond">💠 Elmas Kesim</button>
              <button class="shape-pill" data-shape="badge">🎖️ Rozet</button>
              <button class="shape-pill" data-shape="circle">⭕ Daire</button>
              <button class="shape-pill" data-shape="ellipse">🥚 Elips</button>
              <button class="shape-pill" data-shape="windowGrid">🪟 4'lü Pencere</button>
            </div>
          </div>
        </div>
      </footer>
      <div class="status-bar"><p id="statusText">Hazır. Bir görsel seçerek başlayın.</p></div>
    </div>
  </body>
</html>
